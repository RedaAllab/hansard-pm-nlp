[project]
name = "hansard-pm-nlp"
version = "0.1.0"
description = "NLP analysis of UK PM Hansard rhetoric: cleaning, feature layers, modeling, dashboard."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
