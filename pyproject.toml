[project]
name = "hansard-pm-nlp"
version = "0.1.0"
description = "NLP analysis of UK PM Hansard rhetoric: cleaning, feature layers, modeling, dashboard."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "textstat>=0.7",
    "scikit-learn>=1.4",
    "vaderSentiment>=3.3",
    "transformers>=4.40",
    "torch>=2.2",
    "gensim>=4.3",
    "bertopic>=0.16",
    "spacy>=3.7",
    "statsmodels>=0.14",
    "streamlit>=1.38",
    "plotly>=5.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
