name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Notebooks execute cleanly
        run: |
          python -m ipykernel install --user --name ci-kernel
          jupyter nbconvert --to notebook --execute --stdout \
            --ExecutePreprocessor.kernel_name=ci-kernel \
            --ExecutePreprocessor.timeout=300 \
            notebooks/*.ipynb > /dev/null
